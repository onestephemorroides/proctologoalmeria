<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrusel Condilomas - Preview</title>
<style>
  body { background:#111; margin:0; padding:20px; font-family:-apple-system,sans-serif; }
  h1 { color:#fff; font-size:18px; text-align:center; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; max-width:1000px; margin:0 auto; }
  .card { background:#222; border-radius:10px; overflow:hidden; }
  .card img { width:100%; display:block; }
  .card p { color:#aaa; text-align:center; font-size:13px; margin:8px 0; }
</style>
</head>
<body>
  <h1>Carrusel Condilomas · 6 slides</h1>
  <div class="grid">
    <div class="card"><img src="carrusel-condilomas-slide-01.png"><p>1. Portada</p></div>
    <div class="card"><img src="carrusel-condilomas-slide-02.png"><p>2. Qué son</p></div>
    <div class="card"><img src="carrusel-condilomas-slide-03.png"><p>3. Se detectan tarde</p></div>
    <div class="card"><img src="carrusel-condilomas-slide-04.png"><p>4. Lo que no se ve</p></div>
    <div class="card"><img src="carrusel-condilomas-slide-05.png"><p>5. Tratamiento</p></div>
    <div class="card"><img src="carrusel-condilomas-slide-06.png"><p>6. Cierre ONEstep</p></div>
  </div>
</body>
</html>
