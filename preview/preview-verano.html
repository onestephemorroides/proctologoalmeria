<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verano - Story y Carrusel</title>
<style>
  body { background:#111; margin:0; padding:20px; font-family:-apple-system,sans-serif; }
  h1 { color:#fff; font-size:18px; text-align:center; margin:24px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; max-width:1000px; margin:0 auto; }
  .card { background:#222; border-radius:10px; overflow:hidden; }
  .card img, .card video { width:100%; display:block; }
  .card p { color:#aaa; text-align:center; font-size:13px; margin:8px 0; }
</style>
</head>
<body>
  <h1>Story</h1>
  <div class="grid" style="max-width:300px">
    <div class="card"><video src="story-verano.mp4" controls></video><p>Story (5.5s)</p></div>
  </div>
  <h1>Carrusel · 6 slides</h1>
  <div class="grid">
    <div class="card"><img src="carrusel-verano-slide-01.png"><p>1. Portada</p></div>
    <div class="card"><img src="carrusel-verano-slide-02.png"><p>2. Hemorroides</p></div>
    <div class="card"><img src="carrusel-verano-slide-03.png"><p>3. Fisura anal</p></div>
    <div class="card"><img src="carrusel-verano-slide-04.png"><p>4. Condilomas</p></div>
    <div class="card"><img src="carrusel-verano-slide-05.png"><p>5. Pliegues anales</p></div>
    <div class="card"><img src="carrusel-verano-slide-06.png"><p>6. Cierre ONEstep</p></div>
  </div>
</body>
</html>
